name: release

# La version du POM commande, et rien d'autre. Une fusion sur `master` publie la
# version qui y est écrite, pose le tag correspondant et fabrique la release.
#
# ── Pourquoi ce n'est plus le tag qui déclenche ───────────────────────────────
#
# C'était au tag de lancer la publication, donc à quelqu'un de le poser à la
# main, APRÈS la fusion. Deux gestes pour une seule décision — celle qui est
# déjà prise dans le POM au moment de la revue — et le second s'oublie : la
# version restait alors dans `master` sans jamais atteindre le registre, et le
# POM parent qui la visait ne résolvait pas.
#
# Le tag n'a pas disparu, il a changé de rôle : il n'ordonne plus la
# publication, il l'ATTESTE. Il est posé après elle, sur le commit publié.
#
# ── C'est le REGISTRE qui dit ce qui est publié, pas le tag ───────────────────
#
# La garde interroge GitHub Packages, et non la présence du tag. La différence
# se voit le jour où la publication réussit et où le tag ne se pose pas : avec
# le tag pour seule vérité, rejouer le job retenterait un `deploy` que le
# registre refuse — une version étant immuable — et la réparation deviendrait
# impossible. En interrogeant le registre, l'état se lit tel qu'il est, et
# chaque cas a sa suite :
#
#   publié + tagué      → rien à faire, le job le dit et s'arrête
#   publié, pas tagué   → on pose le tag, sans reconstruire
#   pas publié          → on publie, puis on tague
#
# Rejouer ce workflow est donc toujours sûr, et c'est ce qui le répare.
#
# ── Publier d'abord, taguer ensuite ───────────────────────────────────────────
#
# Dans cet ordre : un tag posé avant une publication qui échoue affirmerait une
# version qui n'existe nulle part.

on:
  push:
    branches: [ master ]
  # Le rattrapage, et il suffit : la garde ci-dessus rend le rejeu sans risque.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Deux fusions coup sur coup ne publient pas en même temps : la seconde attend
# la fin de la première au lieu de l'annuler.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Le job pose un tag : il lui faut l'historique et les tags existants.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Read the version, and ask the registry what is already published
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "VERSION=$version" >> "$GITHUB_ENV"

          url="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/io/github/tszadel/jelastic-maven-plugin/$version/jelastic-maven-plugin-$version.pom"
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "${GITHUB_ACTOR}:${GH_TOKEN}" "$url")

          case "$code" in
            200|302) published=true ;;
            404)     published=false ;;
            # Ni « c'est là » ni « ce n'est pas là » : un 401 ou un 500 pris pour
            # un « pas publié » ferait tenter un deploy voué à l'échec, et pris
            # pour un « publié » sauterait la publication en silence.
            *) echo "::error::The registry answered $code for $url — refusing to guess whether $version is published." >&2; exit 1 ;;
          esac

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then tagged=true; else tagged=false; fi

          echo "publish=$([ "$published" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tag=$([ "$tagged" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          if [ "$published" = true ] && [ "$tagged" = true ]; then
            echo "::notice::Version $version is already published and tagged. Bump the version in the pom to release a new one."
          elif [ "$published" = true ]; then
            echo "::notice::Version $version is already in the registry but was never tagged — tagging it now, without republishing."
          fi

      - name: Publish to GitHub Packages
        if: steps.state.outputs.publish == 'true'
        run: mvn -B --no-transfer-progress deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Le tag atteste ce qui EST au registre, d'où sa place après la publication.
      - name: Tag the published commit
        if: steps.state.outputs.tag == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"

      # Le jar n'est dans `target/` que si CE job vient de le construire : sur le
      # chemin de réparation, la release se fait sans lui plutôt que pas du tout.
      - name: Create the GitHub release
        if: steps.state.outputs.tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar="target/jelastic-maven-plugin-$VERSION.jar"
          if [ -f "$jar" ]; then
            gh release create "v$VERSION" --generate-notes "$jar"
          else
            gh release create "v$VERSION" --generate-notes
          fi
